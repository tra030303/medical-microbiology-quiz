<script>
const BANK=JSON.parse(document.getElementById('questionBank').textContent);const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],cats=[...new Set(BANK.map(x=>x.cat))],countByCat=Object.fromEntries(cats.map(c=>[c,BANK.filter(x=>x.cat===c).length]));let active=new Set(cats),session=[],mode='',pos=0,score=0,locked=false,flipped=false,pendingMode=null;

function scopeText(){$('#scopeText').textContent=active.size===cats.length?'전체 범위 · 모든 카테고리':[...active].join(' · ')}function openScope(nextMode=null){pendingMode=nextMode;const isTopicMode=nextMode==='write'||nextMode==='card';$('#scopeHeading').textContent=nextMode==='write'?'퀴즈에 포함할 주제 선택':nextMode==='card'?'카드에 포함할 주제 선택':'학습 범위 선택';$('#scopeHelp').textContent=nextMode==='write'?'주제를 고르면 선택한 주제의 모든 문항이 주관식 퀴즈에 포함됩니다.':nextMode==='card'?'주제를 고르면 선택한 주제의 모든 문항이 핵심 카드에 포함됩니다.':'선택한 범위의 문제가 세 가지 학습 모드에 공통으로 적용됩니다.';$('#scopeSave').textContent=isTopicMode?'선택한 주제로 시작':'적용하기';$('#checks').innerHTML=cats.map(c=>`<label class="check"><input type="checkbox" value="${esc(c)}" ${active.has(c)?'checked':''}>${esc(c)} <small>(${countByCat[c]}문항)</small></label>`).join('');$('#scopePanel').classList.remove('hidden')}function home(){$('#home').classList.remove('hidden');$('#study').classList.add('hidden');$('#result').classList.add('hidden');scopeText();scrollTo(0,0)}

function render(){locked=false;flipped=false;header();const q=session[pos],tag=`<span class="pill">${esc(q.cat)}</span>`,statement=q.s?`<p class="statement">${esc(q.s)}</p>`:'';if(mode==='card'){$('#lesson').innerHTML=`${tag}${statement}<h2 class="question">카드를 눌러 정답을 확인하세요.</h2><div class="flash" id="flash"><div class="front"><small>QUESTION</small>${esc(q.q)}</div></div><div class="actions"><button class="primary" id="flip">정답 보기</button><button class="secondary" id="next">다음 카드 →</button></div>`;$('#flash').onclick=flip;$('#flip').onclick=flip;$('#next').onclick=next}else{$('#lesson').innerHTML=`${tag}${statement}<h2 class="question">${esc(q.q)}</h2><input class="write" id="write" placeholder="답을 입력하세요" autocomplete="off"><div id="answer"></div><div class="actions"><button class="primary" id="check">정답 확인</button><button class="reveal" id="show">정답 보기</button><button class="secondary" id="next" disabled>다음 문제 →</button></div>`;$('#check').onclick=checkWrite;$('#show').onclick=()=>reveal();$('#next').onclick=next;$('#write').addEventListener('keydown',e=>{if(e.key==='Enter')checkWrite()});$('#write').focus()}}
function feedback(good){const q=session[pos];$('#answer').innerHTML=`<div class="feedback ${good?'good':'notyet'}"><strong>${good?'정답입니다!':'정답을 확인해 보세요.'}</strong>${good?' 잘했어요.':''}</div><div class="answer"><strong>정답 · ${esc(q.a)}</strong>${esc(q.e)}</div>`}function pick(btn){if(locked)return;locked=true;const good=same(btn.dataset.value,session[pos].a);btn.classList.add('selected');if(good)score++;feedback(good);$('#next').disabled=false;$$('.choice').forEach(x=>x.disabled=true)}function checkWrite(){if(locked)return;const v=$('#write').value.trim();if(!v){$('#write').focus();return}locked=true;const good=same(v,session[pos].a);if(good)score++;$('#write').disabled=true;feedback(good);$('#next').disabled=false}function reveal(){if(locked)return;locked=true;$('#write').disabled=true;feedback(false);$('#next').disabled=false}function flip(){if(flipped)return;flipped=true;const q=session[pos];$('#flash').innerHTML=`<div class="back"><small class="mode-kind">ANSWER</small><div>${esc(q.a)}</div><p>${esc(q.e)}</p></div>`;$('#flip').textContent='정답 확인됨'}function next(){if(pos<session.length-1){pos++;render();scrollTo(0,0)}else{finish()}}function finish(){const pct=Math.round(score/session.length*100);$('#study').classList.add('hidden');$('#result').classList.remove('hidden');$('#score').textContent=mode==='card'?`${session.length}장`:`${score} / ${session.length}`;$('#scoreText').textContent=mode==='card'?'선택한 범위의 핵심 카드를 모두 살펴봤습니다.':'정답률 '+pct+'%입니다. '+(pct>=80?'훌륭해요. 다음 모드로 한 번 더 확인해 보세요!':'헷갈렸던 개념은 핵심 카드로 다시 복습해 보세요.');$('#bar').style.width='100%';scrollTo(0,0)}
$$('.mode').forEach(x=>x.onclick=()=>start(x.dataset.mode));$('#scopeOpen').onclick=()=>openScope();$('#scopeCancel').onclick=()=>{pendingMode=null;$('#scopePanel').classList.add('hidden')};$('#scopeSave').onclick=()=>{active=new Set($$('#checks input:checked').map(x=>x.value));if(!active.size){alert('카테고리를 하나 이상 선택해 주세요.');return}const nextMode=pendingMode;pendingMode=null;$('#scopePanel').classList.add('hidden');scopeText();if(nextMode)start(nextMode,true)};$('#homeBtn').onclick=home;$('#resultHome').onclick=home;$('#retry').onclick=()=>start(mode,true);$('#resultScope').onclick=()=>openScope();scopeText();
